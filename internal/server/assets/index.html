<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Player Map</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #d7dae0;
    --dim: #8b93a1;
    --accent: #7fb2ff;
    --ok: #6ee7a8;
    --err: #ff8c8c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--mono);
    -webkit-text-size-adjust: 100%;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    align-items: baseline;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  #map-name { color: var(--accent); }

  #incomplete {
    color: var(--err);
    font-size: 12px;
  }

  #status {
    margin-left: auto;
    color: var(--dim);
    font-size: 12px;
  }
  #status[data-state="running"] { color: var(--accent); }
  #status[data-state="ok"] { color: var(--ok); }
  #status[data-state="error"] { color: var(--err); }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #viewport {
    position: relative;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  #viewport.dragging { cursor: grabbing; }

  #world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    --inv: 1;
  }

  #map {
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  #markers { position: absolute; inset: 0; }

  .marker {
    position: absolute;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%) scale(var(--inv));
    border-radius: 50%;
    /* The fill level is the health percentage: two gradient stops at the same
       position make a hard waterline, so a plain div reads as a gauge with no
       image, no canvas, and nothing to load. It fills the disc inside the
       separation ring — the same disc that used to be solid blue, so a
       full-health server still looks exactly like this map always has, and an
       empty one shows the map through the hole. --hp is set per marker by the
       script, and the fallback colour keeps a marker legible even if it never
       gets a band. */
    --hp: 0%;
    background: linear-gradient(to top,
      var(--hp-color, var(--dim)) var(--hp), transparent var(--hp));
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--hp-color, var(--dim));
  }

  /* Unknown health fills solid grey instead of showing an empty ring: an empty
     ring is what 0% looks like, and "not sampled yet" must not read as "about
     to die". */
  .marker[data-hp="unknown"] { --hp: 100%; }

  .marker .label {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    font-size: 11px;
    color: var(--text);
    text-shadow: 0 1px 2px var(--bg), 0 0 4px var(--bg);
    pointer-events: none;
  }

  #controls {
    position: absolute;
    top: 10px;
    right: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 1;
  }

  button {
    width: 34px;
    height: 34px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #roster {
    width: 240px;
    overflow-y: auto;
    margin: 0;
    padding: 8px 0;
    list-style: none;
    border-left: 1px solid var(--border);
    background: var(--panel);
  }

  #roster:empty::after {
    content: "Nobody is on the server.";
    display: block;
    padding: 6px 14px;
    color: var(--dim);
  }

  #roster li {
    display: flex;
    flex-direction: column;
    padding: 6px 14px;
    cursor: pointer;
  }
  #roster li:hover { background: var(--bg); }
  #roster li .meta { color: var(--dim); font-size: 12px; }
  #roster li.nopos { cursor: default; color: var(--dim); }

  #roster li .hp {
    color: var(--hp-color, var(--dim));
    font-size: 12px;
  }

  #roster li .agid {
    width: fit-content;
    color: var(--dim);
    font-size: 11px;
    cursor: copy;
  }
  #roster li .agid:hover { color: var(--accent); }
  #roster li .agid.flash { color: var(--ok); }
  #roster li .agid.flash.failed { color: var(--err); }

  @media (max-width: 700px) {
    #roster { display: none; }
    #status { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Player Map</h1>
  <span id="map-name">&hellip;</span>
  <span id="incomplete" hidden>player list may be incomplete</span>
  <span id="status" data-state="running">loading&hellip;</span>
</header>

<main>
  <div id="viewport">
    <div id="controls">
      <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button type="button" id="zoom-reset" aria-label="Reset view">&#8962;</button>
    </div>
    <div id="world">
      <img id="map" alt="Map background" draggable="false">
      <div id="markers"></div>
    </div>
  </div>
  <ul id="roster" aria-label="Online players"></ul>
</main>

<script>
(function () {
  "use strict";

  var INTERVAL_MS = {{.IntervalSeconds}} * 1000;
  // Give the server its full deadline plus slack for the round trip before
  // the browser gives up on its own; the server is the authority on timing.
  var ABORT_MS = {{.TimeoutSeconds}} * 1000 + 3000;
  // A snapshot older than a couple of missed polls is worth flagging.
  var STALE_MS = INTERVAL_MS * 2.5;

  var viewport = document.getElementById("viewport");
  var controls = document.getElementById("controls");
  var world = document.getElementById("world");
  var img = document.getElementById("map");
  var markersEl = document.getElementById("markers");
  var roster = document.getElementById("roster");
  var statusEl = document.getElementById("status");
  var mapName = document.getElementById("map-name");
  var incomplete = document.getElementById("incomplete");

  var currentMap = null;
  var lastError = "";
  var playerCount = 0;
  var markers = new Map(); // agid (or name) -> marker element

  // The snapshot's age is tracked from the server-reported ageSeconds plus
  // time since the fetch, never from generatedAt against the local clock:
  // ages computed across two clocks inherit their skew.
  var ageAtFetchMs = null; // null until the first successful poll arrives
  var fetchedAtMs = 0;

  function snapshotAgeMs() {
    if (ageAtFetchMs === null) { return null; }
    return ageAtFetchMs + (Date.now() - fetchedAtMs);
  }

  function setStatus(state, text) {
    statusEl.dataset.state = state;
    statusEl.textContent = text;
  }

  // Everything from the server lands via textContent, so a player name can
  // never be interpreted as markup.
  function updateStatus() {
    if (lastError !== "") {
      setStatus("error", lastError);
      return;
    }
    if (currentMap === null) {
      setStatus("running", "detecting map…");
      return;
    }
    var age = snapshotAgeMs();
    if (age === null) {
      setStatus("running", "waiting for first poll…");
      return;
    }
    var text = playerCount + " online · updated " + Math.round(age / 1000) + "s ago";
    setStatus(age > STALE_MS ? "error" : "ok", text);
  }

  /* --- view: pan and zoom -------------------------------------------- */

  var view = { scale: 1, tx: 0, ty: 0, min: 0.05, max: 16, fitScale: 0 };
  // The viewport size the current transform was laid out for, so a resize
  // can keep the same world point centred.
  var viewW = 0, viewH = 0;

  function apply() {
    world.style.transform = "translate(" + view.tx + "px, " + view.ty + "px) scale(" + view.scale + ")";
    // Markers counter-scale so they keep a constant screen size.
    world.style.setProperty("--inv", String(1 / view.scale));
  }

  function fit() {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (!vw || !vh || !iw || !ih) { return; }
    var scale = Math.min(vw / iw, vh / ih);
    view.min = scale * 0.5;
    view.max = scale * 32;
    view.fitScale = scale;
    view.scale = scale;
    view.tx = (vw - iw * scale) / 2;
    view.ty = (vh - ih * scale) / 2;
    viewW = vw;
    viewH = vh;
    apply();
  }

  window.addEventListener("resize", function () {
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih || !viewW || !viewH) { return; }
    // A view still at fit scale follows the window; a zoomed view keeps its
    // centre and only has its scale bounds recomputed for the new size.
    if (Math.abs(view.scale - view.fitScale) < 1e-9) {
      fit();
      return;
    }
    var cx = (viewW / 2 - view.tx) / view.scale;
    var cy = (viewH / 2 - view.ty) / view.scale;
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var fitScale = Math.min(vw / iw, vh / ih);
    view.min = fitScale * 0.5;
    view.max = fitScale * 32;
    view.fitScale = fitScale;
    view.scale = Math.min(view.max, Math.max(view.min, view.scale));
    view.tx = vw / 2 - cx * view.scale;
    view.ty = vh / 2 - cy * view.scale;
    viewW = vw;
    viewH = vh;
    apply();
  });

  function zoomAt(mx, my, factor) {
    var next = Math.min(view.max, Math.max(view.min, view.scale * factor));
    view.tx = mx - (mx - view.tx) * (next / view.scale);
    view.ty = my - (my - view.ty) * (next / view.scale);
    view.scale = next;
    apply();
  }

  function centerOn(u, v) {
    var vw = viewport.clientWidth, vh = viewport.clientHeight;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    if (!iw || !ih) { return; }
    view.scale = Math.max(view.scale, Math.min(vw / iw, vh / ih) * 4);
    view.tx = vw / 2 - u * iw * view.scale;
    view.ty = vh / 2 - v * ih * view.scale;
    apply();
  }

  img.addEventListener("load", fit);

  viewport.addEventListener("wheel", function (event) {
    event.preventDefault();
    var rect = viewport.getBoundingClientRect();
    zoomAt(event.clientX - rect.left, event.clientY - rect.top,
      Math.exp(-event.deltaY * 0.0015));
  }, { passive: false });

  // Pointer Events cover mouse, touch, and pen alike: one-pointer drag pans,
  // two-pointer pinch zooms at the midpoint.
  var pointers = new Map();
  var pinchDist = 0;

  function pinch() {
    var pts = Array.from(pointers.values());
    var rect = viewport.getBoundingClientRect();
    return {
      x: (pts[0].x + pts[1].x) / 2 - rect.left,
      y: (pts[0].y + pts[1].y) / 2 - rect.top,
      dist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y)
    };
  }

  viewport.addEventListener("pointerdown", function (event) {
    if (controls.contains(event.target)) { return; }
    event.preventDefault();
    viewport.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2) { pinchDist = pinch().dist; }
    viewport.classList.add("dragging");
  });

  viewport.addEventListener("dragstart", function (event) {
    event.preventDefault();
  });

  viewport.addEventListener("pointermove", function (event) {
    var prev = pointers.get(event.pointerId);
    if (!prev) { return; }
    if (pointers.size === 1) {
      view.tx += event.clientX - prev.x;
      view.ty += event.clientY - prev.y;
      apply();
    }
    pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (pointers.size === 2 && pinchDist > 0) {
      var p = pinch();
      zoomAt(p.x, p.y, p.dist / pinchDist);
      pinchDist = p.dist;
    }
  });

  function endPointer(event) {
    pointers.delete(event.pointerId);
    pinchDist = 0;
    if (pointers.size === 0) { viewport.classList.remove("dragging"); }
  }
  viewport.addEventListener("pointerup", endPointer);
  viewport.addEventListener("pointercancel", endPointer);

  document.getElementById("zoom-in").addEventListener("click", function () {
    zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.5);
  });
  document.getElementById("zoom-out").addEventListener("click", function () {
    zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1 / 1.5);
  });
  document.getElementById("zoom-reset").addEventListener("click", fit);

  /* --- data ----------------------------------------------------------- */

  function clamp01(x) { return Math.max(0, Math.min(1, x)); }

  function copyText(text, el) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        function () { flashCopied(el, true); },
        function () { flashCopied(el, legacyCopy(text)); });
      return;
    }
    flashCopied(el, legacyCopy(text));
  }

  function legacyCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    area.remove();
    return ok;
  }

  function flashCopied(el, ok) {
    if (el.classList.contains("flash")) { return; }
    var original = el.textContent;
    el.textContent = ok ? "copied!" : "copy failed";
    el.classList.add("flash");
    if (!ok) { el.classList.add("failed"); }
    setTimeout(function () {
      el.textContent = original;
      el.classList.remove("flash", "failed");
    }, 1200);
  }

  // Health arrives as absolute hit points plus a percentage the server already
  // computed. Only healthPercent may be coloured or sized by: the server
  // reports 96.5 health against a maximum of 850, so the raw number belongs to
  // a player at 11%, and treating it as a percentage would paint them green.
  //
  // hasHealth false covers three cases that all mean the same thing to a
  // viewer — not sampled yet, no pawn, sampling switched off — and none of them
  // may render as 0%, which is what a dying player looks like.
  function healthBand(p) {
    if (!p.hasHealth) { return "unknown"; }
    if (p.healthPercent >= 100) { return "full"; }
    if (p.healthPercent >= 66) { return "high"; }
    if (p.healthPercent >= 33) { return "mid"; }
    return "low";
  }

  function healthText(p) {
    if (!p.hasHealth) { return "hp unknown"; }
    return Math.round(p.healthPercent) + "% hp · " +
      Math.round(p.health) + "/" + Math.round(p.maxHealth);
  }

  // Marks reach seven figures on a long-lived server and the roster is a 240px
  // column, so large values are abbreviated rather than left to wrap over the
  // row below. Small ones keep their exact digits, grouped by the browser's own
  // locale.
  function formatMarks(n) {
    if (typeof n !== "number" || !isFinite(n)) { return "0"; }
    if (Math.abs(n) < 1e4) { return n.toLocaleString(); }
    var thousands = Math.round(n / 1e3);
    // Rounding can carry 999,999 up to a thousand thousand; promote it rather
    // than printing "1000k".
    if (Math.abs(thousands) >= 1e3) { return (thousands / 1e3).toFixed(1) + "M"; }
    return thousands + "k";
  }

  function renderPlayers(list) {
    playerCount = list.length;

    var seen = new Set();
    playerByKey.clear();
    list.forEach(function (p) {
      var key = p.agid || p.name;
      if (!p.hasPosition) { return; }
      seen.add(key);
      playerByKey.set(key, p);
      var m = markers.get(key);
      if (!m) {
        m = document.createElement("div");
        m.className = "marker";
        m.dataset.key = key;
        var label = document.createElement("span");
        label.className = "label";
        m.appendChild(label);
        markersEl.appendChild(m);
        markers.set(key, m);
      }
      // Health is independent of position, so it refreshes even while a marker
      // is held: an admin dragging someone should still see them bleeding.
      // The band picks the colour; --hp is the waterline. It is left unset for
      // unknown health so the stylesheet's solid-grey rule can win — an inline
      // 0% would beat it and show the empty circle that means "dying".
      m.dataset.hp = healthBand(p);
      if (p.hasHealth) {
        m.style.setProperty("--hp", Math.round(clamp01(p.healthPercent / 100) * 1000) / 10 + "%");
      } else {
        m.style.removeProperty("--hp");
      }
      m.title = p.name + " · " + healthText(p);
      m.firstChild.textContent = p.name;
    });
    markers.forEach(function (m, key) {
      if (!seen.has(key)) { m.remove(); markers.delete(key); }
    });

    var frag = document.createDocumentFragment();
    list.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
      .forEach(function (p) {
        var row = document.createElement("li");
        row.className = p.hasPosition ? "" : "nopos";
        var name = document.createElement("span");
        name.textContent = p.name;
        var meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = p.dinosaur +
          (p.growth > 0 ? " · " + Math.round(p.growth * 100) + "% grown" : "") +
          " · " + formatMarks(p.marks) + " marks";
        // The abbreviated figure loses digits, so the exact one stays reachable
        // without spending a line on it.
        if (p.marks >= 1e4) { meta.title = p.marks.toLocaleString() + " marks"; }
        var hp = document.createElement("span");
        hp.className = "hp";
        hp.dataset.hp = healthBand(p);
        hp.textContent = healthText(p);
        // Health refreshes a few players per poll, so its age is not the
        // snapshot's age and is worth saying out loud.
        if (p.hasHealth) {
          hp.title = "sampled " + Math.round(p.healthAgeSeconds || 0) + "s ago";
        }
        row.appendChild(name);
        row.appendChild(meta);
        row.appendChild(hp);
        if (p.agid) {
          var agid = document.createElement("span");
          agid.className = "agid";
          agid.textContent = p.agid;
          agid.title = "Click to copy";
          agid.addEventListener("click", function (event) {
            event.stopPropagation();
            copyText(p.agid, agid);
          });
          row.appendChild(agid);
        }
        if (p.hasPosition) {
          row.addEventListener("click", function () { centerOn(p.u, p.v); });
        }
        frag.appendChild(row);
      });
    roster.replaceChildren(frag);
  }

  function render(data) {
    lastError = data.error || "";

    if (data.map && data.map.name !== currentMap) {
      currentMap = data.map.name;
      mapName.textContent = data.map.displayName;
      document.title = data.map.displayName + " Player Map";
      // Per-map cache buster: a re-detected map must re-fetch, not reuse the
      // old image out of the browser cache.
      img.src = "map.png?m=" + encodeURIComponent(currentMap);
    }

    if (data.generatedAt) {
      ageAtFetchMs = (data.ageSeconds || 0) * 1000;
      fetchedAtMs = Date.now();
      incomplete.hidden = data.complete;
      renderPlayers(data.players);
    }

    updateStatus();
  }

  function refresh() {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, ABORT_MS);

    fetch("api/players", { signal: controller.signal })
      .then(function (response) { return response.json(); })
      .then(render)
      .catch(function (err) {
        lastError = err && err.name === "AbortError"
          ? "no response from the web service after " + Math.round(ABORT_MS / 1000) + "s"
          : "could not reach the web service";
        updateStatus();
      })
      .finally(function () {
        clearTimeout(timer);
        scheduleNext();
      });
  }

  /* --- lifecycle ------------------------------------------------------ */

  var pollTimer = null;

  // Each fetch schedules the next one just past the server poller's next
  // tick, instead of on a fixed interval of its own. Two free-running
  // interval clocks beat against each other: the server regenerates its
  // snapshot right after the fetch that just missed it, and the shown age
  // hovers between one and two intervals. Aiming at
  // (interval − age mod interval) + slack keeps every fetch a moment behind
  // a fresh snapshot, so the age sawtooths from ~0 like it should.
  function scheduleNext() {
    if (document.hidden) { return; }
    clearTimeout(pollTimer);
    var delay = INTERVAL_MS;
    var age = snapshotAgeMs();
    if (age !== null) {
      delay = INTERVAL_MS - (age % INTERVAL_MS) + 750;
      delay = Math.max(1000, Math.min(delay, INTERVAL_MS + 750));
    }
    pollTimer = setTimeout(refresh, delay);
  }

  // A hidden tab stops asking, which is what lets the server stop polling
  // the game: the demand signal the backend watches is this request stream.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(pollTimer);
      pollTimer = null;
    } else {
      refresh();
    }
  });

  setInterval(updateStatus, 1000);
  refresh();
})();
</script>

</body>
</html>
